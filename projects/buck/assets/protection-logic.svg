<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="485" viewBox="0 0 1100 485"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#172b4d}.line{stroke:#205395;stroke-width:3;fill:none}.node{fill:#eef5fc;stroke:#205395;stroke-width:2}</style><text x="25" y="38" font-size="26">有效低OVP/OCP汇总：通用原理，不是完整原理图</text><rect x="40" y="90" width="310" height="110" rx="10" class="node"/><text x="54" y="123" font-size="21">电压比较器</text><text x="54" y="153" font-size="21">采样 &gt; 参考 → 输出低</text><rect x="40" y="280" width="310" height="110" rx="10" class="node"/><text x="54" y="313" font-size="21">电流比较器</text><text x="54" y="343" font-size="21">采样 &gt; 参考 → 输出低</text><rect x="470" y="180" width="230" height="115" rx="10" class="node"/><text x="484" y="213" font-size="21">AND汇总</text><text x="484" y="243" font-size="21">任一路故障 → 低</text><rect x="815" y="180" width="240" height="115" rx="10" class="node"/><text x="829" y="213" font-size="21">TZ3 / OST</text><text x="829" y="243" font-size="21">两相四路PWM低</text><path d="M350,145L430,145" fill="none" stroke="#205395" stroke-width="3"/><path d="M430,145L430,210" fill="none" stroke="#205395" stroke-width="3"/><path d="M430,210L470,210" fill="none" stroke="#205395" stroke-width="3"/><path d="M350,335L430,335" fill="none" stroke="#205395" stroke-width="3"/><path d="M430,335L430,260" fill="none" stroke="#205395" stroke-width="3"/><path d="M430,260L470,260" fill="none" stroke="#205395" stroke-width="3"/><path d="M700,235L815,235" fill="none" stroke="#205395" stroke-width="3"/><text x="45" y="440" font-size="19">开漏/开集输出也可线与；推挽输出不可直接并联。阈值、共模、供电及延迟另行校核。</text></svg>