<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#172b4d}.line{stroke:#205395;stroke-width:3;fill:none}.node{fill:#eef5fc;stroke:#205395;stroke-width:2}</style><text x="25" y="38" font-size="27">供电共地与本地回流：通用示意</text><rect x="35" y="100" width="250" height="120" rx="10" class="node"/><text x="49" y="133" font-size="21">5 V辅助电源</text><text x="49" y="163" font-size="21">输入/输出短回路</text><rect x="720" y="100" width="290" height="120" rx="10" class="node"/><text x="734" y="133" font-size="21">GaN：VCC / PGND</text><text x="734" y="163" font-size="21">本地去耦闭合驱动回流</text><rect x="360" y="330" width="300" height="110" rx="10" class="node"/><text x="374" y="363" font-size="21">MCU / ADC / 运放</text><text x="374" y="393" font-size="21">安静的信号地参考</text><path d="M285,125L720,125" fill="none" stroke="#205395" stroke-width="3"/><text x="410" y="110" font-size="22">+5 V</text><path d="M285,200L720,200" fill="none" stroke="#205395" stroke-width="3"/><text x="300" y="270" font-size="20">低阻公共参考 / 回流按布局组织</text><path d="M510,200L510,330" fill="none" stroke="#205395" stroke-width="3"/><path d="M670,125L670,155" fill="none" stroke="#16816a" stroke-width="3"/><path d="M652,155L688,155" fill="none" stroke="#16816a" stroke-width="3"/><path d="M652,170L688,170" fill="none" stroke="#16816a" stroke-width="3"/><path d="M670,170L670,200" fill="none" stroke="#16816a" stroke-width="3"/><text x="735" y="270" font-size="20" style="fill:#16816a">本地去耦电容靠近GaN</text><text x="25" y="485" font-size="19">低边分流器两端不可被额外地线旁路；此图不规定必须割地或只能单点连接。</text></svg>