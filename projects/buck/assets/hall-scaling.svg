<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="475" viewBox="0 0 1100 475"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#172b4d}.line{stroke:#205395;stroke-width:3;fill:none}.node{fill:#eef5fc;stroke:#205395;stroke-width:2}</style><text x="25" y="38" font-size="27">霍尔到ADC：负载条件与缩放应分别计算</text><rect x="40" y="95" width="290" height="115" rx="10" class="node"/><text x="54" y="128" font-size="21">5 V霍尔，±10 A</text><text x="54" y="158" font-size="21">VH = 2.5 + 0.2 I</text><rect x="410" y="95" width="260" height="115" rx="10" class="node"/><text x="424" y="128" font-size="21">上臂10 kΩ</text><text x="424" y="158" font-size="21">下臂18 kΩ</text><rect x="750" y="95" width="280" height="115" rx="10" class="node"/><text x="764" y="128" font-size="21">3.3 V缓冲器</text><text x="764" y="158" font-size="21">到ADC，保留余量</text><path d="M330,150L410,150" fill="none" stroke="#205395" stroke-width="3"/><path d="M670,150L750,150" fill="none" stroke="#205395" stroke-width="3"/><text x="70" y="280" font-size="26">比例 = 18 / (10 + 18) = 0.642857</text><text x="70" y="330" font-size="23">-10 A → 0.3214 V；0 A → 1.6071 V；+10 A → 2.8929 V</text><text x="70" y="380" font-size="23">分压负载28 kΩ ≥ JSM要求4.7 kΩ</text><text x="70" y="430" font-size="22" style="fill:#bd3034">1 kΩ / 1.8 kΩ组合已撤回：总负载2.8 kΩ过重</text></svg>